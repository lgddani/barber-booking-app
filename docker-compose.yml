services:
  db:
    image: postgres:16-alpine
    container_name: barber-booking-bbdd
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - barber_booking_bbdd_data:/var/lib/postgresql/data

volumes:
  barber_booking_bbdd_data:
